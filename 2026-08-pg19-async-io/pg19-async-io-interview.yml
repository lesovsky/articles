  реальные пробелы: голос/завязка, приоритет резов по объёму, подача источников,
  а также вопросы вокруг публикации (git, скрипты, графики).

  Известные поправки к роадмапу, которые должны доехать в текст:
  - §4.2: fio 808 MB/s занижено (снималось на файле 8 GB). Правильное — 1058 MB/s
    (файл 12 GB). В посте использовать 1058.
  - §2.4 отменён экспериментами: bitmap heap scan — не основной сценарий, а место
    с наименьшим приростом, потому что там у AIO был предшественник.
