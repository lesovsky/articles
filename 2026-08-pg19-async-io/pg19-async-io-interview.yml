  title: "Асинхронный I/O в PostgreSQL: где стало быстрее, где ничего не изменилось и почему"

  publication:
    repo: "github.com/lesovsky/articles (public)"
    material_dir: "2026-08-pg19-async-io/"
    local_path: "~/Git/github.com/lesovsky/articles/2026-08-pg19-async-io/"
