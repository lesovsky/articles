    charts:
      - "развёртка 1→16 сессий: fixed3 / adaptive 2–8 / fixed8 / io_uring / sync"
      - "развёртка eic 0→128 по трём методам — доказывает «без глубины очереди AIO не даёт ничего»"

  stand_representativeness:
    position: |
      Медленный диск стенда (QD1 = 0.238 мс, на порядок медленнее локального NVMe)
      подаётся ГРОМКО и РАНО, с разворотом: выигрыш AIO пропорционален латентности,
      и почти весь прод сегодня живёт не на локальном NVMe, а на сетевом хранилище —
      облачные диски, Ceph, SAN, а также кубернетесовские абстракции для размещения
      персистентных блочных устройств (PV/PVC поверх CSI-драйверов). Стенд
      репрезентативен для типичного прода, а не для ноутбука разработчика.
      Оговорка обязательна: это позиция автора, на быстром хранилище не мерили —
      стенд был один.

  story_line:
    score: 90
    status: "complete"
    value: |
      Канва зафиксирована в ROADMAP §6, 11 разделов, ~3500 слов:
      1. Завязка (~250)
      2. Асинхронным был ровно один сценарий (~250)
      3. Что сделали в 18 и 19 (~350)
      4. Что проверяем и почему так (~250)
      5. Стенд, методика, точка отсчёта (~350)
      6. Сколько даёт апгрейд, если ничего не трогать (~450)
      7. Сколько можно выжать настройкой (~450)
      8. Где AIO не даёт ничего и почему (~350)
      9. Что конкретно меняет 19 (~250)
      10. Как это видно изнутри (~300)
      11. Чеклист (~250)

      ОБЪЁМ ПЕРЕСЧИТАН (батч 3): цель 10–12 минут чтения, потолок 13.
      Целевой объём 2700–3000 слов, жёсткий потолок 3200 (было 3000–3500).
      Бюджеты разделов масштабированы ×0.85:
      1:210, 2:210, 3:300, 4:210, 5:300, 6:380, 7:380, 8:300, 9:210, 10:255, 11:210 ≈ 2965.

      Порядок реза при переполнении (утверждён):
      1) слить раздел 4 «что проверяем и почему так» в раздел 5 «стенд и методика»;
      2) ужимать 10 «как это видно изнутри» до одного примера на метод;
      3) раздел 9 (адаптивный пул) НЕ трогать — единственное, что нового именно
         в 19-й; без него заголовок начинает врать.
    gaps: ""
    required: true

  solution_or_relief:
    score: 85
    status: "complete"
    value: |
АКТУАЛИЗИРОВАНО по эксперименту 5 (RESULTS §9), одна серия, медиана из 3:
      дефолт 19 (worker + eic=16) даёт ×1.7 на seq scan, ×1.6 на VACUUM, ×6.3 на bitmap —
      без открытия конфига. Настройкой: io_uring + eic=64 даёт 848 мс на bitmap,
      ×15.0 к базе 17-й и ×2.4 к дефолту 19. На seq scan и VACUUM настройка не даёт
      ничего (2.5% и 3.1% при разбросе до 19%). Ограничители: eic=0 выключает
      асинхронность целиком на любом сценарии, io_combine_limit=1 обнуляет выигрыш
      на seq scan, прогретый кеш обнуляет разницу между методами полностью
      (110 против 108 мс). Адаптивный пул 19 — не про скорость, а про то, что число
      воркеров больше не надо угадывать.
    gaps: ""
    required: true

  practical_steps:
    score: 85
    status: "complete"
    value: |
      Чеклист (ROADMAP §6 раздел 11):
      - убрать io_workers из конфига до апгрейда — сервер не стартует, в migration-секции
        ни слова (перепроверено 2026-08-11 на beta2 — по-прежнему ни слова)
      - проверить effective_io_concurrency — ноль выключает AIO целиком
      - на мелких разрозненных чтениях пробовать io_uring
      - эффект пропорционален латентности хранилища
      - смотреть время и read_time, долю waits читать только вместе с ними
      - мониторинг переучить: DataFileRead уезжает в процессы io worker
    gaps: ""
    required: true

# ============================================================================
# Phase 3: Integration
# ============================================================================
phase3_integration:

  tool_claims:
    score: 90
    status: "complete"
    value: |
      Утверждения и источники:
      - «io_workers больше нет, сервер не стартует» → docs/19/runtime-config-resource
        + эмпирический лог со стенда (RESULTS §7)
      - «в migration-секции 19 I/O-пунктов нет» → https://www.postgresql.org/docs/19/release-19.html,
        перепроверено 2026-08-11: подтверждено, ни одного I/O-пункта; попутно найдено
        переименование wait event type BUFFERPIN → BUFFER
      - «в 17-й eic по умолчанию 1 и affects only bitmap heap scans» →
        docs/17/runtime-config-resource, цитаты дословные
      - «AIO не покрывает записи ни в 18, ни в 19» → release notes 18/19, wiki.postgresql.org/wiki/AIO
      - «io_uring требует сборки с --with-liburing» → docs/19/runtime-config-resource
      - дефолты 19: io_method=worker, io_min_workers=2, io_max_workers=8,
        io_combine_limit=128kB, eic=16, maintenance_io_concurrency=16 →
        docs/19/runtime-config-resource
      - имена wait events сняты со стенда через pg_wait_events (RESULTS §8), не по памяти

      РЕШЕНО (батч 3): источники ставим живыми ссылками прямо в тексте поста.
      Ссылки к использованию:
      - https://www.postgresql.org/docs/19/release-19.html
      - https://www.postgresql.org/docs/19/runtime-config-resource.html
      - https://www.postgresql.org/docs/17/runtime-config-resource.html
      - https://wiki.postgresql.org/wiki/AIO
      Дополнительная находка при перепроверке release notes 19 (2026-08-11):
      в Migration to Version 19 переименован тип wait event BUFFERPIN → BUFFER —
      уместно в раздел «мониторинг переучить».
    gaps: ""
    required: true

