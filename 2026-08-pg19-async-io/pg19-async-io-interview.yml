# ============================================================================
# Hard framing constraints (заданы пользователем, не подлежат дрейфу)
# ============================================================================
framing_guardrails:
  through_line: |
    До 18-й асинхронным был ровно один сценарий — bitmap heap scan через posix_fadvise,
    причём с дефолтом effective_io_concurrency = 1. В 18-й асинхронность стала общим
    механизмом. Пост отвечает на три вопроса: сколько это даёт по умолчанию, сколько
    можно выжать настройкой, где не даёт ничего и почему.
  comparison_base: "«дефолт 17» (sync + eic=1) vs «дефолт 19» (worker + eic=16) vs «настроенный 19» (io_uring + eic=64)"
  traps:
    - "1. НЕ брать за базу сравнения fadvise с eic=16 — так никто не жил, в 17-й дефолт был 1"
    - "2. Bitmap scan — не провал AIO. Это единственное место, где у AIO был предшественник. Формулировка: AIO не проиграл fadvise, а заменил частное решение общим"
    - "3. effective_io_concurrency — контрольная переменная, не тема поста. Центральная тема — AIO"
    - "4. Отрицательные результаты честно, но без «фича ради фичи»: по умолчанию апгрейд даёт ×1.6–6.3 (уточнено экспериментом 5, замена ×1.8→×1.6 подтверждена пользователем 2026-08-11)"

