  hook_situation:
    score: 85
    status: "complete"
    value: |
      Голос — первое лицо. Точка входа НЕ «стало быстрее» (отклонено пользователем:
      улучшения никто не идёт расследовать, расследуют ухудшения) и НЕ «в конфиге
      незнакомые параметры» (рядовое событие любого мажора).
      Опора завязки: «про асинхронный I/O рассказывают из всех утюгов, я обновился —
      как понять, стало лучше или хуже, и в каких именно местах». Читателю нужна
      точка опоры, прозрачность и определённость: конкретика и фактура вместо
      списка коммитов в release notes.
      Честный ответ, который завязка обещает и текст выдаёт: относительно того, как
      DBA реально жил на 17-й (sync + eic=1), хуже не стало нигде — но есть место,
      где выигрыш даёт не AIO, и есть две ручки, обнуляющие его целиком.
    gaps: ""
    required: true

  target_reader:
    score: 95
    status: "complete"
    value: |
      DBA, работающие с PostgreSQL, для которых AIO — новый зверь. Площадка — Хабр,
      личный аккаунт (не корпоративный блог). Уровень: практикующий DBA, знает
      pg_stat_activity, EXPLAIN, wait events; не обязан знать io_uring и read stream.
      Объём: цель была 10–12 минут при потолке 13; по итогам валидации пользователь
      принял 14.4 минуты (21.6k знаков, 2.9k слов прозы) — прирост пошёл на фактуру,
      которой потребовали проверки. Тон практический, без маркетинга.
    gaps: ""
    required: true

  reader_value:
    score: 85
    status: "complete"
    value: |
      Читатель получает отправную точку: сколько даёт апгрейд по умолчанию (×1.8–6.3),
      сколько можно выжать настройкой (io_uring на bitmap до ×14.8 к дефолту 17),
      где не даёт ничего (eic=0 и io_combine_limit=1 обнуляют эффект) и почему.
